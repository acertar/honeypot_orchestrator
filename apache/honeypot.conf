# =============================================================================
# Honeypot Orchestrator — Apache 2.4 reverse proxy
# =============================================================================
# Требуемые модули:
#   a2enmod ssl proxy proxy_http proxy_wstunnel rewrite headers ratelimit remoteip
#
# Self-signed сертификат для Admin Panel:
#   openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/honeypot-admin.key \
#     -out /etc/ssl/certs/honeypot-admin.crt \
#     -subj "/CN=honeypot-admin.local"
#
# Подключение:
#   cp honeypot.conf /etc/apache2/sites-available/
#   a2ensite honeypot && systemctl reload apache2
# =============================================================================

# -----------------------------------------------------------------------------
# Общие настройки безопасности
# -----------------------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Admin Panel слушает только loopback (TLS).
# Если 8443 уже объявлен в ports.conf — удалите эту строку.
Listen 127.0.0.1:8443

# -----------------------------------------------------------------------------
# Dashboard (публичный, SOC-аналитики) — http://<host>/
# -----------------------------------------------------------------------------
<VirtualHost *:80>
    ServerName honeypot-dashboard.local
    DocumentRoot /var/www/html

    ErrorLog  ${APACHE_LOG_DIR}/honeypot-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/honeypot-dashboard-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # Базовые security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    # HSTS (эффективен после публикации Dashboard по HTTPS).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # ---- Rate limiting на логин (mod_ratelimit, KB/s) ----
    <Location "/api/v1/auth/login">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 64
        SetEnv rate-initial-burst 128
    </Location>

    # ---- WebSocket: /ws/ -> Socket.IO бэкенда ----
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/(.*)$ ws://127.0.0.1:5000/ws/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/ws/(.*)$ http://127.0.0.1:5000/ws/$1 [P,L]

    # Явный proxy для Socket.IO handshake
    ProxyPass        /socket.io/ http://127.0.0.1:5000/socket.io/ upgrade=websocket
    ProxyPassReverse /socket.io/ http://127.0.0.1:5000/socket.io/

    # ---- REST API и базовые шаблоны ----
    ProxyPass        /api/ http://127.0.0.1:5000/api/
    ProxyPassReverse /api/ http://127.0.0.1:5000/api/

    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Не проксируем админские API наружу
    <Location "/api/v1/users">
        Require all denied
    </Location>
    <Location "/api/v1/audit">
        Require all denied
    </Location>
</VirtualHost>

# -----------------------------------------------------------------------------
# Admin Panel (только localhost/VPN) — https://127.0.0.1:8443/
# -----------------------------------------------------------------------------
<VirtualHost 127.0.0.1:8443>
    ServerName honeypot-admin.local
    DocumentRoot /var/www/html

    SSLEngine On
    SSLCertificateFile    /etc/ssl/certs/honeypot-admin.crt
    SSLCertificateKeyFile /etc/ssl/private/honeypot-admin.key
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    SSLHonorCipherOrder   On

    ErrorLog  ${APACHE_LOG_DIR}/honeypot-admin-error.log
    CustomLog ${APACHE_LOG_DIR}/honeypot-admin-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 120

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "no-referrer"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

    # Ограничение доступа: только loopback (VPN-подсети добавьте при необходимости)
    <Location "/">
        Require local
        # Require ip 10.8.0.0/24
    </Location>

    # Rate limiting на логин
    <Location "/api/v1/auth/login">
        SetOutputFilter RATE_LIMIT
        SetEnv rate-limit 32
        SetEnv rate-initial-burst 64
    </Location>

    # WebSocket live-лента
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/(.*)$ ws://127.0.0.1:5001/ws/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} !=websocket [NC]
    RewriteRule ^/ws/(.*)$ http://127.0.0.1:5001/ws/$1 [P,L]

    ProxyPass        /socket.io/ http://127.0.0.1:5001/socket.io/ upgrade=websocket
    ProxyPassReverse /socket.io/ http://127.0.0.1:5001/socket.io/

    ProxyPass        /api/ http://127.0.0.1:5001/api/
    ProxyPassReverse /api/ http://127.0.0.1:5001/api/

    ProxyPass        / http://127.0.0.1:5001/
    ProxyPassReverse / http://127.0.0.1:5001/
</VirtualHost>
